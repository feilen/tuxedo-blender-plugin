# Dynamically detect Blender versions from snap and run tests against all supported versions

name: Run Tuxedo-Blender-Plugin tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: "0 4 * * 1"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9"]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}

    - name: Detect and install Blender versions
      run: |
        sudo snap set system experimental.parallel-instances=true

        # parse snap info: extract channel, skip "latest" and "tracking" lines
        # output: channel  version  (e.g. "2.93lts  2.93.18")
        versions=$(snap info blender | grep '/stable:' | grep -E '^[[:space:]]+[0-9]+\.[0-9]+' | awk '{gsub(/\/stable:.*/, "", $1); print $1, $2}')

        # install each version >= 2.93
        echo "$versions" | while read -r channel version; do
          major=$(echo "$version" | cut -d. -f1)
          minor=$(echo "$version" | cut -d. -f2)
          combined=$((major * 100 + minor))
          
          if [ "$combined" -lt 293 ]; then
            echo "skipping $channel ($version) — below minimum 2.93"
            continue
          fi

          # snap name: strip "lts" from channel, remove dot (e.g. "2.93lts" -> "blender_293")
          snap_name="blender_$(echo "$channel" | sed 's/lts//;s/\.//')"
          
          echo "installing $snap_name from $channel/stable ..."
          sudo snap install "$snap_name" --channel "${channel}/stable" --classic
        done

    - name: Set up plugin symlinks
      run: |
        versions=$(snap info blender | grep '/stable:' | grep -E '^[[:space:]]+[0-9]+\.[0-9]+' | awk '{gsub(/\/stable:.*/, "", $1); print $1, $2}')
        
        echo "$versions" | while read -r channel version; do
          major=$(echo "$version" | cut -d. -f1)
          minor=$(echo "$version" | cut -d. -f2)
          combined=$((major * 100 + minor))
          
          if [ "$combined" -lt 293 ]; then
            continue
          fi

          config_version="${major}.${minor}"
          snap_name="blender_$(echo "$channel" | sed 's/lts//;s/\.//')"
          
          addon_dir="${HOME}/.config/blender/${config_version}/scripts/addons"
          mkdir -p "$addon_dir"
          ln -sf "${PWD}" "${addon_dir}/tuxedo-blender-plugin"
          echo "symlinked plugin for $snap_name ($config_version)"
        done

    - name: Run tests
      run: |
        versions=$(snap info blender | grep '/stable:' | grep -E '^[[:space:]]+[0-9]+\.[0-9]+' | awk '{gsub(/\/stable:.*/, "", $1); print $1, $2}')
        
        echo "$versions" | sort -t. -k1,1n -k2,2n | while read -r channel version; do
          major=$(echo "$version" | cut -d. -f1)
          minor=$(echo "$version" | cut -d. -f2)
          combined=$((major * 100 + minor))
          
          if [ "$combined" -lt 293 ]; then
            continue
          fi

          snap_name="blender_$(echo "$channel" | sed 's/lts//;s/\.//')"
          
          echo "=== testing $snap_name ($version) ==="
          
          python3 ./tests/run.py --blend="$snap_name" --test=./tests/empty/* --bfile=./tests/empty/empty.* -c True || exit 1
          python3 ./tests/run.py --blend="$snap_name" --test=./tests/bake/* --bfile=./tests/bake/bake.* -c True || exit 1
          
          if [ "$combined" -ge 31 ]; then
            python3 ./tests/run.py --blend="$snap_name" --test=./tests/facetracking/* --bfile=./tests/facetracking/facetracking.* -c True || exit 1
          fi
        done



